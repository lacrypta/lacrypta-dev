# Local Nostr relay for La Crypta Labs dev — OPTIONAL Docker engine.
#
# The default relay is dev/relay/server.mjs (Node, host arch, no image pull).
# This compose file is the alternative for running the real nostr-rs-relay:
#
#   RELAY_ENGINE=docker pnpm relay:up     # start  (ws://localhost:7777)
#   RELAY_ENGINE=docker pnpm relay:logs   # tail
#   RELAY_ENGINE=docker pnpm relay:down   # stop
#
# `pnpm relay:up` health-checks whichever engine it started, so a container that
# comes up and immediately dies fails the command instead of passing silently.
#
# Fully isolated either way: nothing published here ever reaches a public relay,
# so you can exercise voting / projects / badges without permanently polluting
# production (Nostr events can't be deleted once they hit a real relay).
#
# Point the app at it with NEXT_PUBLIC_NOSTR_RELAYS=ws://localhost:7777
services:
  nostr-relay:
    image: scsibug/nostr-rs-relay:latest
    container_name: labs-nostr-relay
    restart: unless-stopped
    # scsibug/nostr-rs-relay publishes an amd64-only image. Declaring the
    # platform is what routes it through Rosetta/QEMU on an arm64 host —
    # necessary there, but NOT sufficient: the host also needs amd64 emulation
    # installed (Docker Desktop → General → "Use Rosetta for x86_64/amd64
    # emulation", or `docker run --privileged tonistiigi/binfmt --install amd64`).
    # Check with `docker run --rm --privileged tonistiigi/binfmt`: if the
    # supported platforms list has no linux/amd64, this container will start and
    # crash-loop on `exec /bin/sh: exec format error` no matter what — use the
    # default Node relay (`pnpm relay:up`) instead.
    platform: linux/amd64
    # Host 7777 -> container 8080 (nostr-rs-relay's default listen port).
    ports:
      - "7777:8080"
    volumes:
      # Config is read from ./config.toml relative to WORKDIR /usr/src/app.
      # Read-only so the container can't rewrite our checked-in config.
      - ./config.toml:/usr/src/app/config.toml:ro
      # SQLite DB dir. The image CMD hardcodes `--db /usr/src/app/db`, which
      # overrides config's data_directory — so the DB volume MUST mount here.
      - ./data:/usr/src/app/db
